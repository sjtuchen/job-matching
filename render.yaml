services:
  - type: web
    name: job-matching
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend-integration/server.py
    envVars:
      - key: INTEGRATION_HOST
        value: 0.0.0.0
      - key: PORT
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
